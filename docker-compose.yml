version: '3.9'
services:
  api:
    image: python:3.11-slim
    working_dir: /app/apps/api
    volumes:
      - ./:/app
    command: bash -lc "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env

  web:
    image: node:20
    working_dir: /app/apps/web
    volumes:
      - ./:/app
    command: bash -lc "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - api
